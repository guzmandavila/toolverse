<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Media Forge · Toolverse</title><style>body{margin:0;background:#0a0a0b;color:#f2f0ea;font:15px system-ui,sans-serif}.wrap{max-width:760px;margin:auto;padding:28px 20px}.top{display:flex;justify-content:space-between;border-bottom:1px solid #292626;padding-bottom:18px}.back{color:#fff;text-decoration:none}.panel{margin-top:70px;border:1px solid #383838;background:#151416;padding:28px}.eyebrow{font:11px monospace;letter-spacing:.15em;color:#aaa;text-transform:uppercase}.h1{font-size:clamp(38px,8vw,72px);line-height:.95;margin:18px 0}.sub{color:#aab3b5;max-width:560px}.drop{margin-top:28px;border:1px dashed #777;padding:30px;text-align:center}.controls{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}select,button,label{background:#252426;color:#fff;border:1px solid #555;border-radius:4px;padding:11px 14px}button{cursor:pointer;font-weight:700;background:#f2f0ea;color:#111}#status{color:#aab3b5;margin-top:18px;font-family:monospace}a{color:#ddd}</style></head><body><div class="wrap"><header class="top"><b>TOOLVERSE · MEDIA FORGE</b><a class="back" href="./">← Volver</a></header><main class="panel"><div class="eyebrow">Conversión local · sin subir archivos</div><div class="h1">Dale otra forma<br>a tu material.</div><p class="sub">Convierte, comprime o extrae desde el navegador. Elige un preset, suelta un archivo y descarga el resultado.</p><div class="drop"><label for="file">01 · Elegir archivo</label><input id="file" type="file" accept="video/*,audio/*" hidden><div id="name">Ningún archivo seleccionado</div></div><div class="controls"><select id="preset"><option value="reel">Reel · 1080 × 1920</option><option value="youtube">YouTube · 1280 × 720</option><option value="compress">Comprimir para compartir</option><option value="audio">Extraer audio · MP3</option><option value="gif">Crear GIF corto</option></select><button id="go">02 · Procesar</button></div><div id="status">Listo para recibir un archivo.</div></main></div><script type="module">import{FFmpeg}from'https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/esm/index.js';import{fetchFile,toBlobURL}from'https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.1/dist/esm/index.js';const ff=new FFmpeg(),file=document.querySelector('#file'),name=document.querySelector('#name'),status=document.querySelector('#status');let input;file.onchange=()=>{input=file.files[0];name.textContent=input?.name||'Ningún archivo seleccionado'};document.querySelector('#go').onclick=async()=>{if(!input)return status.textContent='Primero elige un archivo.';const btn=document.querySelector('#go');btn.disabled=true;status.textContent='Cargando motor…';try{if(!ff.loaded){const base='https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.6/dist/esm';await ff.load({coreURL:await toBlobURL(base+'/ffmpeg-core.js','text/javascript'),wasmURL:await toBlobURL(base+'/ffmpeg-core.wasm','application/wasm')})}const ext=input.name.split('.').pop().toLowerCase(),src='input.'+ext;await ff.writeFile(src,await fetchFile(input));const p=document.querySelector('#preset').value;let args,out;if(p==='reel'){args=['-i',src,'-vf','scale=1080:1920:force_original_aspect_ratio=decrease,pad=1080:1920:(ow-iw)/2:(oh-ih)/2','-c:v','libx264','-preset','fast','-crf','23','-c:a','aac','output.mp4'];out='output.mp4'}else if(p==='youtube'){args=['-i',src,'-vf','scale=1280:720:force_original_aspect_ratio=decrease,pad=1280:720:(ow-iw)/2:(oh-ih)/2','-c:v','libx264','-preset','fast','-crf','22','-c:a','aac','output.mp4'];out='output.mp4'}else if(p==='audio'){args=['-i',src,'-vn','-q:a','2','output.mp3'];out='output.mp3'}else if(p==='gif'){args=['-i',src,'-t','6','-vf','fps=12,scale=640:-1:flags=lanczos','output.gif'];out='output.gif'}else{args=['-i',src,'-c:v','libx264','-crf','28','-preset','fast','-c:a','aac','output.mp4'];out='output.mp4'}status.textContent='Procesando…';await ff.exec(args);const data=await ff.readFile(out);const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data.buffer]));a.download=out;a.click();status.textContent='Listo. El archivo se descargó.'}catch(e){status.textContent='No se pudo procesar: '+e.message}finally{btn.disabled=false}};</script></body></html>
